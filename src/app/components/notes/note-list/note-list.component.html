<div class="flex flex-col p-4">
  @for(note of notes; track note.title) {
  <div
    class="flex flex-col gap-2 border-t p-2 border-gray-300 hover:bg-gray-200 cursor-pointer"
  >
    <h1 class="font-bold mt-2">{{ note.title }}</h1>
    <div class="flex gap-4">
      @for(tag of note.tags; track tag) {
      <span class="text-[11px] bg-gray-300 p-1 px-2 rounded-md">{{ tag }}</span>
      }
    </div>
    <h3 class="text-gray-500 text-sm">{{ note.date }}</h3>
  </div>
  }
</div>
